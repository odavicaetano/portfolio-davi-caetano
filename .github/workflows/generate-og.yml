name: Gerar capa de compartilhamento
on:
  push:
    branches: [main]
    paths:
      - 'assets/og-image.svg'
      - '.github/workflows/generate-og.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar conversor
        run: python -m pip install cairosvg pillow
      - name: Renderizar capa Open Graph
        run: |
          python - <<'PY'
          import cairosvg
          from PIL import Image
          from io import BytesIO
          data=cairosvg.svg2png(url='assets/og-image.svg',output_width=1200,output_height=630)
          image=Image.open(BytesIO(data)).convert('RGB')
          image.save('assets/og-image.jpg',quality=94,optimize=True,subsampling=0)
          PY
      - name: Publicar imagem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og-image.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza capa de compartilhamento com identidade do site"
            git push
          fi
